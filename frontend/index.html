<!DOCTYPE html>
<html lang="es-CO" translate="no">
  <head>
    <title><%= productName %></title>
    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <!-- Evita que el navegador (Chrome/Google Translate) traduzca la interfaz: la
         traduccion automatica rompe el menu y las etiquetas ya estan en espanol. -->
    <meta name="google" content="notranslate" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width" />

    <!-- Icono de la pestana: el logo de Gym Barichara. En tamanos chicos va una
         version compacta (GYM + corazon); el logo completo, en los grandes. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d0d0d" />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
